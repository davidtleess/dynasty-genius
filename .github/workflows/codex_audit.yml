  # successes (2026-07-01 .. 2026-07-24).
  #
  # Mechanism, bounded to what the evidence establishes: codex_audit.py calls
  # execute_statement with wait_timeout="50s" (:114-117) and then tests ONLY
  # `state == SUCCEEDED` (:120). A non-terminal state carries no `.error`, so the
  # else-branch (:138) renders it as the literal string "Unknown error". The code
