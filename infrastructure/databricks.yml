# ⚠️ RETIRED ON DAVID'S RULING, 2026-08-30 ("as for databricks - we can retire it"). DG-101.
#
# This bundle is dead weight kept ONLY so `databricks bundle destroy` still has a definition to
# tear down with. Nothing in app/ or src/ imports Databricks; the master plan's restraint list
# (§9) rules out a cloud warehouse for this product, and the plan flagged this bundle
# "retire it or wire it. URGENT" (:814).
#
# STATE: the workspace side is NOT yet torn down — the stored CLI credential's refresh token is
# invalid, so the deployed job (if any) could not be listed or destroyed from this session.
# A `.databricks/bundle/dev/` state dir dated 2026-05-08 shows a deploy was at least attempted.
# TO FINISH (one sitting, in this order — the order matters):
#   1. databricks auth login --profile dbc-228373f7-57ec        # interactive, browser
#   2. databricks bundle destroy -t dev                          # tears down deployed resources
#   3. delete infrastructure/ entirely, and this file with it
# Deleting these files BEFORE step 2 orphans whatever is deployed: destroy needs the definition.
#
# Until then the schedule below ships PAUSED, so a stray `bundle deploy` cannot re-arm a job
# that fired every single minute.

bundle:
  name: dynasty-genius-sovereign-unity

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL Warehouse ID for query execution
    default: 5e883b4bfbb1e3f4
  notification_email:
    description: Email for job failure notifications
    default: david.t.leess@gmail.com

# Development environment (runs as current user)
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-228373f7-57ec.cloud.databricks.com
      profile: dbc-228373f7-57ec
    # No run_as in dev - jobs run as the deploying user

  # Production environment (runs as service principal)
  prod:
    mode: production
    workspace:
      host: https://dbc-228373f7-57ec.cloud.databricks.com
      profile: dbc-228373f7-57ec
      root_path: /Workspace/.bundles/prod/${bundle.name}
    run_as:
      service_principal_name: c058228c-6c4a-44ac-9c83-97441099cb97
